name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax and privacy leak check
        run: |
          python -m compileall -q src build.py tests
          python -c "import build, pathlib; build.check_leaks(pathlib.Path('src'))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
